# Pruebas y construcción de la PWA en cada push y PR; despliegue en GitHub Pages solo desde main.
# Requiere: Settings → Pages → Source = GitHub Actions.
name: Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build:pwa
      - name: Comprobar el sitio generado (ficheros, sintaxis, manifest, versión sellada)
        run: npm run check:site
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/site }
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: d
        uses: actions/deploy-pages@v4
